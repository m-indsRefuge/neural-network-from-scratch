[project]
name = "neural-network-from-scratch"
version = "0.1.0"
description = "A neural network implemented from first principles with Python and NumPy."
readme = "README.md"
authors = [
    { name = "Nolan Augustine", email = "nolanaug@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
